<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Start your project with a Postgres database. Add Authentication, Data APIs, Edge Functions, Realtime Data, Storage, and Vector embeddings."
    />
    <title>Supabase | The Postgres Development Platform</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Resolve the theme before first paint. Without this, a light-theme visitor
      sees the dark default flash on every reload. Kept inline and synchronous on
      purpose — it must run before the stylesheet applies.
      The storage key is shared with src/hooks/useTheme.ts.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('supabase-clone-theme')
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches
          var theme = stored === 'light' || stored === 'dark' ? stored : prefersLight ? 'light' : 'dark'
          document.documentElement.dataset.theme = theme
        } catch (_) {
          /* Private mode or blocked storage — the dark default in the markup stands. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
